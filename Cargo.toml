[package]
name = "rustfs-tokio-tar"
version = "0.7.1"
authors = [
    "Alex Crichton <alex@alexcrichton.com>",
    "dignifiedquire <me@dignifiequire.com>",
    "Artem Vorotnikov <artem@vorotnikov.me>",
    "Aiden McClelland <me@drbonez.dev>",
    "cxymds <cxymds@gmail.com>",
    "houseme <housemecn@gmail.com>",
]
homepage = "https://github.com/cxymds/tokio-tar"
repository = "https://github.com/cxymds/tokio-tar"
documentation = "https://docs.rs/rustfs-tokio-tar"
license = "MIT OR Apache-2.0"
keywords = ["tar", "tarfile", "encoding"]
readme = "README.md"
edition = "2021"
rust-version = "1.83.0"
exclude = ["/scripts/"]

description = """
A Rust implementation of an async TAR file reader and writer. This library does not
currently handle compression, but it is abstract over all I/O readers and
writers. Additionally, great lengths are taken to ensure that the entire
contents are never required to be entirely resident in memory all at once.
"""

[dependencies]
futures-core = "0.3"
portable-atomic = "1"
rustc-hash = "2.1.3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync"] }
tokio-stream = { version = "0.1", default-features = false }
zerocopy = { version = "0.8.57", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
xattr = { version = "1.6", optional = true }

[features]
default = ["xattr"]

[lib]
name = "tokio_tar"
